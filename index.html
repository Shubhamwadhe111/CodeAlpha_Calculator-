<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Professional Calculator</title>
  <meta name="description" content="A sleek, modern, and professional calculator with real-time computation, calculation history, keyboard support, and theme toggle.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="dark">
  <main class="app-container">
    <div class="calculator-card" id="calculatorApp">
      <!-- Calculator Header -->
      <header class="calculator-header">
        <div class="header-brand">
          <span class="brand-badge">CALC</span>
          <span class="brand-title">Executive Precision</span>
        </div>
        <div class="header-actions">
          <button id="soundToggle" class="icon-btn" title="Toggle Sound Feedback" aria-label="Toggle Sound Feedback">
            <svg id="soundOnIcon" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <svg id="soundOffIcon" class="icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <line x1="23" y1="9" x2="17" y2="15"></line>
              <line x1="17" y1="9" x2="23" y2="15"></line>
            </svg>
          </button>

          <button id="historyToggle" class="icon-btn" title="Calculation History" aria-label="Toggle History Panel">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span class="history-badge hidden" id="historyCount">0</span>
          </button>

          <button id="themeToggle" class="icon-btn" title="Toggle Light/Dark Theme" aria-label="Toggle Light/Dark Theme">
            <svg id="sunIcon" class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <svg id="moonIcon" class="icon hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          </button>
        </div>
      </header>

      <!-- Calculator Display Screen -->
      <section class="display-container" aria-label="Calculator Screen">
        <div class="display-top">
          <div class="equation-display" id="equationDisplay" title="Current Calculation Expression"></div>
          <button id="copyBtn" class="copy-btn" title="Copy result to clipboard" aria-label="Copy result">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span class="copy-tooltip" id="copyTooltip">Copied!</span>
          </button>
        </div>
        
        <div class="display-main">
          <div class="primary-display" id="primaryDisplay" aria-live="polite">0</div>
        </div>

        <div class="display-preview" id="previewDisplay" aria-live="off"></div>
      </section>

      <!-- Calculator Keypad Grid -->
      <section class="keypad-grid" role="group" aria-label="Calculator Keypad">
        <!-- Row 1: Utility / Clear functions -->
        <button type="button" class="key key-func" data-action="clear" id="keyClear" title="Clear (Escape)">
          <span class="key-label" id="clearLabel">AC</span>
        </button>
        <button type="button" class="key key-func" data-action="backspace" id="keyBackspace" title="Backspace (Backspace)">
          <svg class="icon-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
            <line x1="18" y1="9" x2="12" y2="15"></line>
            <line x1="12" y1="9" x2="18" y2="15"></line>
          </svg>
        </button>
        <button type="button" class="key key-func" data-action="percentage" id="keyPercent" title="Percentage (%)">
          <span class="key-label">%</span>
        </button>
        <button type="button" class="key key-operator" data-action="operator" data-value="÷" id="keyDivide" title="Divide (/)">
          <span class="key-label">÷</span>
        </button>

        <!-- Row 2: 7, 8, 9, Multiply -->
        <button type="button" class="key key-num" data-action="digit" data-value="7" id="key7">
          <span class="key-label">7</span>
        </button>
        <button type="button" class="key key-num" data-action="digit" data-value="8" id="key8">
          <span class="key-label">8</span>
        </button>
        <button type="button" class="key key-num" data-action="digit" data-value="9" id="key9">
          <span class="key-label">9</span>
        </button>
        <button type="button" class="key key-operator" data-action="operator" data-value="×" id="keyMultiply" title="Multiply (*)">
          <span class="key-label">×</span>
        </button>

        <!-- Row 3: 4, 5, 6, Subtract -->
        <button type="button" class="key key-num" data-action="digit" data-value="4" id="key4">
          <span class="key-label">4</span>
        </button>
        <button type="button" class="key key-num" data-action="digit" data-value="5" id="key5">
          <span class="key-label">5</span>
        </button>
        <button type="button" class="key key-num" data-action="digit" data-value="6" id="key6">
          <span class="key-label">6</span>
        </button>
        <button type="button" class="key key-operator" data-action="operator" data-value="−" id="keySubtract" title="Subtract (-)">
          <span class="key-label">−</span>
        </button>

        <!-- Row 4: 1, 2, 3, Add -->
        <button type="button" class="key key-num" data-action="digit" data-value="1" id="key1">
          <span class="key-label">1</span>
        </button>
        <button type="button" class="key key-num" data-action="digit" data-value="2" id="key2">
          <span class="key-label">2</span>
        </button>
        <button type="button" class="key key-num" data-action="digit" data-value="3" id="key3">
          <span class="key-label">3</span>
        </button>
        <button type="button" class="key key-operator" data-action="operator" data-value="+" id="keyAdd" title="Add (+)">
          <span class="key-label">+</span>
        </button>

        <!-- Row 5: Invert (+/-), 0, Decimal (.), Equals (=) -->
        <button type="button" class="key key-num" data-action="negate" id="keyNegate" title="Toggle Negative/Positive (±)">
          <span class="key-label">±</span>
        </button>
        <button type="button" class="key key-num" data-action="digit" data-value="0" id="key0">
          <span class="key-label">0</span>
        </button>
        <button type="button" class="key key-num" data-action="decimal" id="keyDecimal" title="Decimal point (.)">
          <span class="key-label">.</span>
        </button>
        <button type="button" class="key key-equals" data-action="equals" id="keyEquals" title="Calculate (Enter or =)">
          <span class="key-label">=</span>
        </button>
      </section>

      <!-- Keyboard shortcut hint footer -->
      <footer class="calculator-footer">
        <div class="shortcut-hints">
          <span><kbd>0</kbd>–<kbd>9</kbd> Numbers</span>
          <span><kbd>+</kbd> <kbd>−</kbd> <kbd>×</kbd> <kbd>÷</kbd> Ops</span>
          <span><kbd>Enter</kbd> =</span>
          <span><kbd>Esc</kbd> AC</span>
          <span><kbd>⌫</kbd> Del</span>
        </div>
      </footer>

      <!-- Slide-over History Drawer -->
      <aside class="history-panel hidden" id="historyPanel" aria-label="Calculation History Panel">
        <div class="history-header">
          <div class="history-title-wrap">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <h3>Calculation History</h3>
          </div>
          <button id="closeHistoryBtn" class="icon-btn-sm" aria-label="Close history">
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="history-list" id="historyList">
          <div class="history-empty" id="historyEmpty">
            <svg class="icon-lg opacity-40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="7" y1="8" x2="17" y2="8"></line>
              <line x1="7" y1="12" x2="17" y2="12"></line>
              <line x1="7" y1="16" x2="13" y2="16"></line>
            </svg>
            <p>No calculation history yet</p>
            <span class="subtext">Completed calculations will appear here. Click any item to reuse.</span>
          </div>
        </div>

        <div class="history-footer">
          <button id="clearHistoryBtn" class="clear-history-btn" disabled>
            <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Clear History
          </button>
        </div>
      </aside>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
